services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --user=neo4j --password=password123 --auth-no-challenge
          --header='Content-Type: application/json'
          --post-data='{"statements":[{"statement":"RETURN 1"}]}'
          http://127.0.0.1:7474/db/neo4j/tx/commit | grep -qF '"errors":[]'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - neo4j_data:/data
      - ./neo4j/cypher:/cypher:ro

  backend:
    build: &backend-build
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    depends_on: &backend-dependencies
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment: &backend-environment
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      NEO4J_DATABASE: neo4j
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      QUERY_CLASSIFIER_USE_LLM: ${QUERY_CLASSIFIER_USE_LLM:-true}
      DOCUMENT_UPLOAD_DIR: /app/uploads/documents
      DOCUMENT_PARSER_ENABLED: ${DOCUMENT_PARSER_ENABLED:-true}
      DOCUMENT_JOB_TIMEOUT_SECONDS: ${DOCUMENT_JOB_TIMEOUT_SECONDS:-120}
      DOCUMENT_JOB_MAX_ATTEMPTS: ${DOCUMENT_JOB_MAX_ATTEMPTS:-3}
      DOCUMENT_JOB_MAX_BYTES: ${DOCUMENT_JOB_MAX_BYTES:-26214400}
      PARSER_SERVICE_DIR: /parser_service
      PARSER_OUTPUT_DIR: parser/output
    volumes: &backend-volumes
      - backend_uploads:/app/uploads
      - ./neo4j/parser_service:/parser_service

  document-worker:
    build: *backend-build
    init: true
    restart: on-failure
    depends_on: *backend-dependencies
    environment: *backend-environment
    volumes: *backend-volumes
    command: ["python", "-m", "app.document_worker"]

  parser-service:
    build:
      context: ./neo4j/parser_service
      dockerfile: Dockerfile
    container_name: parser-service
    depends_on:
      - neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      NEO4J_DATABASE: neo4j
      USE_NER: "true"
    volumes:
      - ./neo4j/parser_service/parser/output:/app/parser/output
      - ./neo4j/parser_service/parser/samples:/app/parser/samples
    command: ["python", "-m", "parser.main", "--help"]

volumes:
  neo4j_data:
  backend_uploads:
